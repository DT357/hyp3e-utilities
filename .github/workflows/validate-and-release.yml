name: Validate and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate module
        run: npm run check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./module.json').version")"
          if [[ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version ${manifest_version}." >&2
            exit 1
          fi

      - name: Package module
        run: zip -r hyp3e-utilities.zip module.json README.md LICENSE THIRD_PARTY_NOTICES.md module styles lang templates

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          hyp3e-utilities.zip
          module.json
          --verify-tag
          --generate-notes
          --title "Hyp3e Utilities ${GITHUB_REF_NAME}"
