name: Validate and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate module
        run: npm run check

      - name: Verify package metadata
        shell: bash
        run: |
          manifest_version="$(node -p "require('./module.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${manifest_version}" != "${package_version}" ]]; then
            echo "module.json ${manifest_version} does not match package.json ${package_version}." >&2
            exit 1
          fi

      - name: Package validated module
        shell: bash
        run: |
          mapfile -t release_paths < scripts/release-files.txt
          zip -X -r hyp3e-utilities.zip "${release_paths[@]}"
          unzip -t hyp3e-utilities.zip
          unzip -p hyp3e-utilities.zip module.json | cmp --silent - module.json

      - name: Generate and verify checksums
        shell: bash
        run: |
          sha256sum module.json hyp3e-utilities.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Retain validated release candidate
        uses: actions/upload-artifact@v7
        with:
          name: hyp3e-utilities-release-candidate
          path: |
            hyp3e-utilities.zip
            module.json
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@v8
        with:
          name: hyp3e-utilities-release-candidate
          path: release-artifacts

      - name: Verify release candidate
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt
          manifest_version="$(jq -r '.version' module.json)"
          if [[ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version ${manifest_version}." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-artifacts/hyp3e-utilities.zip
          release-artifacts/module.json
          release-artifacts/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Hyp3e Utilities ${GITHUB_REF_NAME}"
